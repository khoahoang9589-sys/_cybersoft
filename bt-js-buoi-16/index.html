<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container w-75 my-5 p-4 shadow rounded bg-body-secondary border">
        <form class="row gy-3 align-items-center px-2">
            <div class="col-12 col-lg-6">
                <input type="number" class="form-control" id="inputNum" placeholder="Nhập số n">
            </div>
            <div class="col-12 col-lg-6">
                <button class="btn btn-primary mx-2 rounded-5" type="button" onclick="addNum()">Thêm số</button>
            </div>
            <div class="alert alert-danger" role="alert">
                👉 <span id="txtNum"></span>
            </div>
        </form>
        <div class="accordion" id="accordionExample">
            <!-- bai 1 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">1️⃣ Tổng số dương
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="sumDuong()">Tính</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtSumDuong"></span>
                        </div>

                    </div>
                </div>
            </div>
            <!-- bai 2  -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo"> 2️⃣ Đếm số
                        dương</button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="countDuong()">Đếm</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtCountDuong"></span>
                        </div>

                    </div>
                </div>
            </div>
            <!-- bai 3 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                        3️⃣ Tìm số nhỏ nhất
                    </button>
                </h2>
                <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="soNhoNhat()">Tìm</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtSoNhoNhat"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 4 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse4" aria-expanded="false" aria-controls="collapseThree">
                        4️⃣ Tìm số dương nhỏ nhất
                    </button>
                </h2>
                <div id="collapse4" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="soDuongNhoNhat()">Tìm</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtSoDuongNhoNhat"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 5 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse5" aria-expanded="false" aria-controls="collapseThree">
                        5️⃣ Tìm số chẵn cuối cùng
                    </button>
                </h2>
                <div id="collapse5" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="soChanCuoi()">Tìm</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtSoChanCuoi"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 6 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse6" aria-expanded="false" aria-controls="collapseThree">
                        6️⃣ Đổi chỗ
                    </button>
                </h2>
                <div id="collapse6" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center gap-2">
                        <div class="col-lg-4 col-12">
                            <input type="number" class="form-control" id="viTri1" placeholder="Nhập số vị trí 1">
                        </div>
                        <div class="col-lg-4 col-12">
                            <input type="number" class="form-control" id="viTri2" placeholder="Nhập số vị trí 2">
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary rounded-5" type="button" onclick="doiCho()">Đổi chỗ</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtDoiCho"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 7 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse7" aria-expanded="false" aria-controls="collapseThree">
                        7️⃣ Sắp xếp tăng dần
                    </button>
                </h2>
                <div id="collapse7" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                   <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="tangDan()">Sắp xếp</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtTangDan"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 8 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse8" aria-expanded="false" aria-controls="collapseThree">
                        8️⃣ Tìm số nguyên tố đầu tiên
                    </button>
                </h2>
                <div id="collapse8" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="findPrime()">Tìm số nguyên tố</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtsoNguyenTo"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 9 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse9" aria-expanded="false" aria-controls="collapseThree">
                        9️⃣ Đếm số nguyên
                    </button>
                </h2>
                <div id="collapse9" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center gap-2">
                        <div class="col-lg-4 col-12">
                            <input type="number" class="form-control" id="inputFloat" placeholder="Nhập số">
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary rounded-5" type="button" onclick="addFloat()">Thêm số</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtFloat"></span>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary rounded-5" type="button" onclick="countFloat()">Đếm số nguyên</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtCountFloat"></span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bai 10 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse99" aria-expanded="false" aria-controls="collapseThree">
                        🔟 So sánh số lượng số âm và dương
                    </button>
                </h2>
                <div id="collapse99" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body row align-items-center px-5">
                        <div class="col-12">
                            <button class="btn btn-primary m-2 rounded-5" type="button"
                                onclick="soSanhso()">So Sánh</button>
                        </div>
                        <div class="col-12 alert alert-danger" role="alert">
                            👉 <span id="txtSoSanh"></span>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
        integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
